name: Update Profile Stats

on:
  schedule:
    # Executa todos os dias às 00:00 UTC (21:00 BRT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite disparo manual na aba Actions

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Assets
        run: |
          python scripts/make_all.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg avi-ascii.svg info-card.svg project-api-fetcher.svg project-jp-spending.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update profile heatmap and metrics [skip ci]" && git push)
